<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>시선 — 하루 한 장, 하루 한 말씀</title>
<meta name="description" content="매일 아침, 사진 한 장과 말씀 한 구절. 시선">
<meta name="theme-color" content="#F2EFE8">
<meta property="og:type" content="website">
<meta property="og:site_name" content="시선">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="시선 — 하루 한 장, 하루 한 말씀">
<meta property="og:description" content="매일 아침, 사진 한 장과 말씀 한 구절이 도착합니다.">
<meta property="og:url" content="https://sajinmalsseum-full.vercel.app/about/">
<meta property="og:image" content="https://sajinmalsseum-full.vercel.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F2EFE8;--ink:#1F1F1C;--sub:#7A766D;--accent:#2F4A45;--accent2:#344741;--line:#E3DED3;--panel:#F9F8F4}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;line-height:1.6;
    display:flex;justify-content:center}
  .phone{width:100%;max-width:440px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:0 22px calc(env(safe-area-inset-bottom) + 22px)}
  .top{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:clamp(56px,12vh,110px)}
  .appicon{width:92px;height:92px;border-radius:22px;background:var(--accent);color:#F2EFE8;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Gowun Batang',serif;font-size:34px;line-height:1.02;letter-spacing:1px;box-shadow:0 16px 36px rgba(47,74,69,.28)}
  .tag{margin-top:22px;font-family:'Gowun Batang',serif;font-size:15px;color:var(--sub);letter-spacing:-.2px}
  .verse{margin-top:46px;font-family:'Gowun Batang',serif;font-size:19px;line-height:1.85;color:var(--ink);max-width:320px;word-break:keep-all}
  .verse b{font-weight:700}
  .steps{margin-top:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px 14px}
  .steps h4{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:10px}
  .steps .row{display:flex;align-items:center;gap:12px;font-size:13.5px;color:#3d3b35;padding:6px 0}
  .steps .row b{color:var(--ink)}
  .steps svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .cta{display:flex;align-items:center;justify-content:center;margin-top:14px;height:52px;border-radius:16px;background:var(--accent2);color:#F5F3EC;
    font-size:16px;font-weight:800;text-decoration:none;letter-spacing:-.2px;transition:transform .12s}
  .cta:active{transform:scale(.98)}
  .foot{margin-top:18px;text-align:center;font-size:11.5px;color:#a39d8f}
  .foot a{color:var(--sub);text-decoration:none}
  .hidden{display:none}
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <div class="appicon"><span>시</span><span>선</span></div>
    <div class="tag">하루 한 장, 하루 한 말씀</div>
    <div class="verse">사람이 만든 것은 언젠가 썩어지지만<br>하나님이 지으신 것은,<br><b>"영원합니다"</b></div>
  </div>

  <div class="steps">
    <h4>매일 아침 받아보려면</h4>
    <div class="row" id="stepShare"><svg viewBox="0 0 24 24"><path d="M12 3.5v11M8.3 7.2 12 3.5l3.7 3.7M5.5 12.5v6a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-6"/></svg><span>아래 <b>공유 버튼</b>을 누르고</span></div>
    <div class="row" id="stepAdd"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8.5v7M8.5 12h7"/></svg><span><b>홈 화면에 추가</b>를 선택하세요</span></div>
    <div class="row"><svg viewBox="0 0 24 24"><path d="M6.5 16.5v-5.5a5.5 5.5 0 0 1 11 0v5.5l1.5 1.8h-14z"/><path d="M10.2 20.5a1.9 1.9 0 0 0 3.6 0"/></svg><span>정한 시간에 <b>오늘의 한 장</b>이 도착해요</span></div>
  </div>
  <a class="cta" href="/">오늘의 한 장 보기</a>
  <div class="foot">사진 채수호 · 말씀 개역한글 · <a href="/privacy.html">개인정보처리방침</a></div>
</div>
<script>
  // 안드로이드/크롬은 공유 버튼이 아니라 메뉴에서 추가하므로 문구만 바꿔줍니다
  var ua = navigator.userAgent || '';
  if (!/iPad|iPhone|iPod/.test(ua)) {
    document.querySelector('#stepShare span').innerHTML = '브라우저 <b>메뉴(⋮)</b>를 누르고';
  }
</script>
</body>
</html>
